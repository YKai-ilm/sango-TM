<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="三國霸業">
<meta name="theme-color" content="#0a0e1c">
<title>三國霸業</title>
<style>
  :root{--sea:#6fb3d8;--pink:#f3d4ca;--pink2:#f8e3da;--brown:#7a4a35;--brown2:#5a3526;--ink:#3a2418;--navy:#1f3a8a;--navy2:#16296b;--gold:#e8b94a;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{height:100vh;overflow:hidden;background:var(--navy2);touch-action:manipulation;font-family:"MingLiU","Microsoft JhengHei","Courier New",monospace;color:var(--ink);}
  #stagewrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 10px 16px,transparent 7px,var(--navy) 8px 9px,transparent 10px) 0 0/20px 16px,var(--navy2);}
  #stage{width:932px;height:430px;flex:0 0 auto;transform-origin:center center;position:relative;background:var(--sea);overflow:hidden;}
  .app{display:flex;gap:5px;width:100%;height:100%;padding:5px;}
  .center{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;background:var(--sea);position:relative;}
  canvas#map{max-width:100%;max-height:100%;cursor:pointer;display:block;}
  .left,.right{display:none;}
  #stage.city .left{display:flex;} #stage.city .right{display:flex;}
  .left{position:absolute;top:5px;left:5px;bottom:5px;z-index:7;width:150px;flex-direction:column;gap:4px;}
  .box{background:var(--pink);border:2px solid var(--brown);border-radius:3px;padding:3px 6px;box-shadow:inset 0 0 0 2px var(--pink2);}
  .lord{font-size:12px;line-height:1.45;color:var(--brown2);} .lord b{color:#9c2b1e;}
  .statehead{font-size:18px;font-weight:bold;color:var(--brown2);display:flex;align-items:baseline;gap:6px;}
  .statehead small{font-size:11px;color:#8a5a3a;font-weight:normal;}
  .stats{font-size:12px;line-height:1.5;}
  .stats .r{display:flex;justify-content:space-between;} .stats .r span:last-child{font-weight:bold;color:var(--brown2);}
  .stats .gm{display:flex;gap:12px;}
  .cmdbar{min-height:0;display:flex;flex-wrap:wrap;gap:3px;}
  .cmdbar button{flex:1 1 30%;font-family:inherit;font-size:12px;background:var(--pink2);border:2px solid var(--brown);border-radius:3px;padding:4px 1px;cursor:pointer;color:var(--ink);}
  .cmdbar button:disabled{opacity:.4;} .cmdbar button.atk{background:#e8c9a0;border-color:#8a3a1a;color:#7a2a10;font-weight:bold;}
  .cmdbar .hint{flex:1 1 100%;font-size:11px;color:#8a5a3a;text-align:center;align-self:center;}
  .builds{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:auto;align-self:flex-start;width:330px;background:var(--pink);border:3px solid var(--brown);border-radius:5px;padding:6px;box-sizing:border-box;}
  .bld{background:var(--pink);border:2px solid var(--brown);border-radius:3px;padding:3px;cursor:pointer;text-align:center;font-size:14px;color:var(--brown2);}
  .bld.on{background:var(--gold);}
  .bld .bav{width:100%;aspect-ratio:1;background:#f7e9d5;border:2px solid var(--brown2);border-radius:3px;display:flex;align-items:center;justify-content:center;margin-bottom:3px;overflow:hidden;font-size:26px;line-height:1;}
  .bld .bav svg{width:80%;height:80%;}
  .right{position:absolute;top:5px;right:5px;bottom:5px;z-index:7;width:74px;flex-direction:column;gap:5px;}
  .rbtn{background:var(--pink);border:2px solid var(--brown);border-radius:3px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--brown2);padding:9px 3px;text-align:center;}
  .rbtn.face{padding:3px;} .rbtn.face .av{width:100%;aspect-ratio:1;background:var(--gold);border:2px solid var(--brown2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:2px;}
  .rbtn.end{background:#6b2f1d;color:var(--gold);border-color:var(--gold);font-weight:bold;}
  #hud{position:absolute;inset:0;pointer-events:none;z-index:8;} #stage.city #hud{display:none;} #hud>*{pointer-events:auto;}
  .datebar{position:absolute;top:8px;left:8px;background:var(--pink);border:2px solid var(--brown);border-radius:3px;padding:3px 10px;font-size:16px;font-weight:bold;color:var(--brown2);display:flex;gap:7px;align-items:center;box-shadow:inset 0 0 0 2px var(--pink2);}
  .datebar .ico{width:20px;height:20px;background:var(--navy);color:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .round{position:absolute;width:50px;height:50px;border-radius:50%;border:3px solid #aeb9d0;cursor:pointer;background:radial-gradient(circle at 34% 28%,#fff,#c6d0e2 70%,#9aa6c0);color:#33406a;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
  #hud-skip{top:64px;left:14px;} #hud-set,#hud-set2{width:42px;height:42px;font-size:11px;right:14px;} #hud-set{bottom:14px;} #hud-set2{bottom:62px;} #hud-zoom{top:14px;right:14px;width:42px;height:42px;font-size:20px;}
  #hud-msg{position:absolute;bottom:10px;left:10px;max-width:62%;background:var(--pink);border:2px solid var(--brown);border-radius:3px;padding:6px 14px;font-size:15px;font-weight:bold;color:#9c2b1e;box-shadow:inset 0 0 0 2px var(--pink2);transition:opacity .2s;opacity:.85;pointer-events:none;}
  #hud-msg.faded{opacity:.22;pointer-events:none;}
  #setmenu{position:absolute;bottom:110px;right:14px;display:none;flex-direction:column;gap:4px;width:82px;}
  #setmenu2{position:absolute;bottom:110px;right:14px;display:none;flex-direction:column;gap:4px;width:82px;z-index:9;}
  #setmenu button,#setmenu2 button{font-family:inherit;font-size:11px;background:var(--pink);border:2px solid var(--brown);border-radius:3px;padding:5px 2px;cursor:pointer;color:var(--brown2);box-shadow:inset 0 0 0 2px var(--pink2);}
  .slotrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--pink2);border:2px solid var(--brown);border-radius:3px;padding:7px 10px;cursor:pointer;font-size:13px;color:var(--ink);}
  .slotrow:active{background:var(--gold);}
  .slotrow.dis{opacity:.45;cursor:default;}
  .slotrow b{color:var(--brown2);} .slotrow span{font-size:12px;color:#7a4a35;}
  #editor{display:none;position:absolute;inset:0;z-index:20;pointer-events:none;}
  #ed-left{position:absolute;left:5px;top:35px;bottom:35px;width:64%;background:var(--pink);border:3px solid var(--gold);box-shadow:inset 0 0 0 2px var(--brown);padding:10px 20px;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:16px;pointer-events:auto;}
  #ed-block{position:absolute;left:0;top:0;bottom:0;right:84px;pointer-events:auto;}
  .edrow{display:grid;grid-template-columns:64px 116px 48px 1fr 48px;align-items:center;gap:12px;font-size:26px;color:var(--brown2);}
  .edlbl{font-weight:bold;text-align:center;white-space:nowrap;}
  .edval{text-align:right;font-weight:bold;cursor:pointer;background:#fbeee0;border:2px solid #c9a06a;border-radius:5px;padding:3px 8px;}
  .edbtn{height:42px;font-size:22px;background:var(--pink2);border:2px solid var(--brown);border-radius:5px;cursor:pointer;color:var(--brown2);}
  .edsl{width:100%;}
  #rotate{display:none;position:fixed;inset:0;z-index:99;background:var(--navy2);color:var(--gold);flex-direction:column;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:30px;gap:14px;}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex;}}
  .overlay{position:fixed;inset:0;background:rgba(10,15,40,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;}
  .modal{background:var(--pink);border:4px solid var(--gold);border-radius:5px;padding:18px;max-width:720px;max-height:90vh;overflow-y:auto;box-shadow:inset 0 0 0 2px var(--brown);}
  .modal h2{color:#9c2b1e;text-align:center;letter-spacing:6px;margin:0 0 10px;}
  .fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:12px 0;}
  .fpick{border:2px solid var(--brown);border-radius:3px;padding:6px;cursor:pointer;font-size:12px;background:var(--pink2);color:var(--ink);} .fpick b{font-size:15px;}
  .hint2{font-size:12px;color:#7a4a35;}
  table.gt{width:100%;border-collapse:collapse;font-size:13px;} table.gt th,table.gt td{border:1px solid var(--brown);padding:3px 6px;text-align:center;} table.gt th{background:var(--pink2);}
  .loglist{font-size:13px;line-height:1.6;max-height:50vh;overflow-y:auto;} .loglist .war{color:#b03a1e;} .loglist .good{color:#2f7a2f;} .loglist .sys{color:#3a4a8a;}
  #battleCanvas{width:100%;max-width:700px;border:3px solid var(--brown);border-radius:4px;background:#000;}
  .bbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  .bbtns button{font-family:inherit;font-size:15px;padding:8px 22px;background:var(--gold);border:2px solid var(--brown2);border-radius:3px;cursor:pointer;color:var(--ink);}
  #mainmenu{flex-direction:column;gap:16px;background:radial-gradient(circle at 50% 35%,#1b2750,#0a0e1c 75%);}
  .mmtitle{font-family:'MingLiU';font-size:52px;font-weight:bold;letter-spacing:10px;color:var(--gold);text-shadow:3px 3px 0 #6b2f1d,0 0 14px rgba(232,185,74,.45);}
  .mmsub{color:#9aa6c0;font-size:13px;letter-spacing:3px;margin-top:-6px;}
  .mmbtn{font-family:inherit;font-size:20px;letter-spacing:5px;padding:11px;background:linear-gradient(#f3e3ca,#e8c9a0);border:3px solid var(--gold);border-radius:5px;color:#5a3526;cursor:pointer;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .mmbtn:active{background:var(--gold);}
  #start{background:#101935;}
  .gcard{display:flex;align-items:center;gap:12px;background:var(--pink2);border:2px solid var(--brown);border-radius:5px;padding:8px 12px;box-shadow:inset 0 0 0 2px var(--pink);}
  .gportrait{width:50px;height:50px;flex:0 0 auto;background:var(--gold);border:2px solid var(--brown2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:#5a3526;}
  .ginfo{flex:1;text-align:left;}
  .gname{font-size:18px;font-weight:bold;color:#9c2b1e;}
  .gname small{font-size:12px;color:#7a4a35;font-weight:normal;}
  .gstats{font-size:14px;color:var(--brown2);margin-top:3px;}
  .gstats2{font-size:13px;color:#7a4a35;margin-top:2px;}
  .shopbtn{display:block;width:100%;font-family:inherit;font-size:13px;text-align:left;background:var(--pink2);border:2px solid var(--brown);border-radius:3px;padding:5px 8px;margin-bottom:4px;cursor:pointer;color:var(--brown2);}
  .shopbtn:disabled{opacity:.45;cursor:default;}
</style>
</head>
<body>
<div id="stagewrap"><div id="stage">
  <div class="app">
    <div class="left">
      <div class="box" style="display:flex;align-items:center;gap:7px;font-size:15px;font-weight:bold;color:var(--brown2)">
        <span id="l-ym">190年 1月</span>
        <span style="margin-left:auto;display:flex;gap:5px;align-items:center"><span style="width:20px;height:20px;background:var(--navy);color:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px">⚑</span><span id="l-ap">4</span></span></div>
      <div class="box lord">君主　<b id="lord">—</b><br>太守　<b id="gov">—</b></div>
      <div class="box statehead"><span id="sname">—</span><small>統治度 <b id="gov-rate">—</b></small></div>
      <div class="box stats">
        <div class="r gm"><span>金 <b id="s-gold">—</b></span><span>米 <b id="s-rice">—</b></span></div>
        <div class="r"><span>土地</span><span id="s-land">—</span></div>
        <div class="r"><span>產業</span><span id="s-ind">—</span></div>
        <div class="r"><span>人口</span><span id="s-pop">—</span></div>
        <div class="r"><span>防災</span><span id="s-flood">—</span></div>
        <div class="r"><span>武將 <span id="s-gen">0</span></span><span>在野 <span id="s-wild">0</span></span></div>
        <div class="r"><span>士兵</span><span id="s-troops">—</span></div>
      </div>
      <div class="builds" id="builds">
      </div>
    </div>
    <div class="center"><canvas id="map" width="1000" height="562"></canvas></div>
    <div class="right">
      <div class="rbtn end" id="btn-back2">編輯</div>
      <div class="rbtn" id="btn-edmax" style="display:none" onclick="edMax()">最大</div>
      <div class="rbtn face" id="btn-gen" style="margin-top:auto"><div class="av">⚔</div>武將</div>
      <div class="rbtn" id="btn-back">返回</div>
    </div>
  </div>
  <div id="hud">
    <div class="datebar"><span id="h-ym">190年 1月</span><span class="ico">⚑</span><span id="h-ap">4</span></div>
    <div class="round" id="hud-skip" title="進行">⏭</div>
    <div class="round" id="hud-zoom" title="放大">🔍</div>
    <div class="round" id="hud-set" title="設定（測試）">⚙</div>
    <div class="round" id="hud-set2" title="設定（玩家）">★</div>
    <div id="setmenu">
      <button onclick="openGen()">武　將</button>
      <button onclick="openLog()">戰　報</button>
      <button onclick="startGuided()">逐城定位</button>
      <button onclick="toggleEdit()">微調拖曳</button>
      <button onclick="toggleFlags()">淨空旗幟</button>
      <button onclick="exportPos()">匯出座標</button>
    </div>
    <div id="setmenu2">
      <button onclick="openAllGen()">武將一覽</button>
      <button onclick="openAllCity()">城池一覽</button>
      <button onclick="cheatTodo('裝備一覽')">裝備一覽</button>
      <button onclick="cheatTodo('金手指解鎖')">金手指解鎖</button>
      <button onclick="cheatTodo('待新增1')">待新增1</button>
      <button onclick="saveGame()">存　檔</button>
      <button onclick="loadGame()">讀　檔</button>
      <button onclick="openHelp()">說　明</button>
      <button onclick="backToMenu()">回主畫面</button>
    </div>
    <div id="hud-msg">　</div>
  </div>
</div></div>
<div id="rotate"><div style="font-size:46px">📱↻</div>請將手機橫置使用</div>
<div class="overlay" id="mainmenu">
  <div class="mmtitle">三 國 霸 業</div>
  <div class="mmsub">群雄割據・一統天下　v1.0</div>
  <div style="display:flex;flex-direction:column;gap:11px;width:240px;margin-top:4px">
    <button class="mmbtn" id="mm-continue" style="display:none;background:linear-gradient(#bfe3b0,#9ccf86);border-color:#2f7a2f" onclick="doLoad(0)">繼續遊戲</button>
    <button class="mmbtn" onclick="startNewGame()">開始遊戲</button>
    <button class="mmbtn" onclick="loadGame()">讀取存檔</button>
    <button class="mmbtn" onclick="openHelp()">遊戲說明</button>
  </div>
</div>
<div class="overlay" id="start" style="display:none"><div class="modal">
  <h2>三 國 霸 業</h2>
  <div id="scn-stage">
    <p style="text-align:center;font-size:13px;color:#7a4a35;">選擇劇本開局</p>
    <div class="fgrid" id="scn-grid"></div>
    <div class="bbtns"><button onclick="gotoMenu()">← 回主畫面</button></div>
  </div>
  <div id="fac-stage" style="display:none">
    <p style="text-align:center;font-size:13px;color:#7a4a35;"><b id="scn-title"></b>・選擇你的勢力，一統天下</p>
    <div class="fgrid" id="fac-grid"></div>
    <p class="hint2">點城池展開指令；每回合行動力（⚑），政廳開墾／振興／登用、軍隊出陣、市集買賣米、倉庫輸送。右下圓鈕進行下回合。<br><span onclick="backToScn()" style="cursor:pointer;color:#9c2b1e;text-decoration:underline">← 重新選擇劇本</span></p>
  </div>
</div></div>
<div class="overlay" id="genlist" style="display:none"><div class="modal">
  <h2 style="letter-spacing:3px">我 軍 武 將</h2>
  <table class="gt" id="gt"><thead><tr><th>武將</th><th>所在</th><th>武力</th><th>智力</th><th>統率</th></tr></thead><tbody></tbody></table>
  <div class="bbtns"><button onclick="$('genlist').style.display='none'">關閉</button></div>
</div></div>
<div class="overlay" id="info" style="display:none"><div class="modal">
  <h2 id="info-title" style="letter-spacing:3px">戰　報</h2>
  <div id="info-body" class="loglist"></div>
  <div class="bbtns"><button onclick="$('info').style.display='none'">關閉</button></div>
</div></div>
<div class="overlay" id="battle" style="display:none"><div class="modal" style="text-align:center">
  <h2 style="letter-spacing:3px" id="b-title">戰　鬥</h2>
  <canvas id="battleCanvas" width="700" height="320"></canvas>
  <div class="bbtns" id="b-btns"></div>
</div></div>
<div class="overlay" id="savebox" style="display:none"><div class="modal" style="max-width:560px">
  <h2 id="sb-title" style="letter-spacing:3px">存　檔</h2>
  <div id="sb-body"></div>
  <div class="bbtns" id="sb-btns"></div>
</div></div>
<div id="editor"><div id="ed-block"></div><div id="ed-left"></div></div>
<div class="overlay" id="shop" style="display:none"><div class="modal" style="max-width:600px">
  <h2 style="letter-spacing:3px">武　庫</h2>
  <div id="shop-head" style="font-size:14px;margin-bottom:8px;color:#5a3526"></div>
  <div style="margin-bottom:6px">武將：<select id="shop-gen" style="font-size:15px;font-family:inherit"></select></div>
  <div id="shop-cur" style="font-size:13px;margin-bottom:8px;color:#5a3526"></div>
  <div style="display:flex;gap:12px">
    <div style="flex:1"><div style="font-weight:bold;color:#9c2b1e;margin-bottom:4px">武器</div><div id="shop-weap" style="max-height:40vh;overflow-y:auto"></div></div>
    <div style="flex:1"><div style="font-weight:bold;color:#9c2b1e;margin-bottom:4px">防具</div><div id="shop-armor" style="max-height:40vh;overflow-y:auto"></div></div>
  </div>
  <div class="bbtns"><button onclick="$('shop').style.display='none'">關閉</button></div>
</div></div>
<div class="overlay" id="gencards" style="display:none"><div class="modal" style="max-width:540px">
  <h2 id="gc-title" style="letter-spacing:2px;font-size:20px">城內武將</h2>
  <div id="gc-body" style="max-height:56vh;overflow-y:auto;display:flex;flex-direction:column;gap:7px"></div>
  <div class="bbtns"><button onclick="gcPage(-1)">◀ 上頁</button><span id="gc-page" style="align-self:center;min-width:64px;text-align:center;font-weight:bold"></span><button onclick="gcPage(1)">下頁 ▶</button><button onclick="$('gencards').style.display='none'">關閉</button></div>
</div></div>
<script>
const $=id=>document.getElementById(id);

function resolveBattle(fromId,toId,isAI,aiFac){
  const A=state.cs[fromId],D=state.cs[toId];const aG=topGen(fromId),dG=topGen(toId);
  const send=Math.floor(A.troops*0.85);if(send<300)return;A.troops-=send;
  const data={fromId,toId,attacker:A.owner,defender:D.owner,aG,dG,atk:send,def:D.troops,aMax:send,dMax:D.troops,round:0,win:false};
  const aW=aG?gsOf(aG).wu+(WATK[gsOf(aG).weap]||0):40,aL=aG?gsOf(aG).tong:30,dW=dG?gsOf(dG).wu+(WATK[gsOf(dG).weap]||0):40,dL=dG?gsOf(dG).tong:30,wall=D.flood,aArm=aG?(ADEF[gsOf(aG).armor]||0):0,dArm=dG?(ADEF[gsOf(dG).armor]||0):0;
  while(data.atk>0&&data.def>0&&data.round<8){data.round++;
    const ap=data.atk*(0.5+aL/130)*(0.85+Math.random()*0.4)+aW*6;
    const dp=data.def*(0.5+dL/130)*(0.85+Math.random()*0.4)*(1+wall/200)+dW*6;
    data.atk=Math.max(0,data.atk-Math.max(0,Math.floor(dp*0.10)-aArm));data.def=Math.max(0,data.def-Math.max(0,Math.floor(ap*0.10)-dArm));}
  if(data.def<=0&&data.atk>0){data.win=true;const old=D.owner;D.owner=A.owner;D.troops=data.atk;D.gens=[];D.gov=40;if(aG){A.gens=A.gens.filter(g=>g!==aG);D.gens.push(aG);}if(old)checkElim(old);}
  else{A.troops+=data.atk;D.troops=data.def;}
  {const aKill=data.dMax-data.def,dKill=data.aMax-data.atk;if(aG)addExp(aG,Math.floor(aKill/100),data.attacker);if(dG&&!data.win)addExp(dG,Math.floor(dKill/100),data.defender);}
  if(isAI){log("war","✖ 【"+facName(aiFac)+"】"+(data.win?"攻陷 ":"進攻 ")+cityById(toId).name+(data.win?"":"（守住）"));checkVictory();}
  else{showBattleScreen(data);}

function aiTurn(fid){let ap=Math.min(12,3+CITIES.filter(c=>state.cs[c.id].owner===fid).length);

    const tg=ADJ[cid].filter(id=>state.cs[id].owner!==fid).sort((a,b)=>state.cs[a].troops-state.cs[b].troops)[0];
    if(tg!=null&&s.troops>3000&&s.troops>state.cs[tg].troops*1.25){resolveBattle(cid,tg,true,fid);ap--;continue;}
    if(s.gold>1500&&s.troops<Math.floor(s.pop*0.18)){const amt=Math.min(1000,Math.floor(s.gold/0.05),Math.floor(s.rice/0.1));if(amt>=100){s.troops+=amt;s.gold-=Math.ceil(amt*0.05);s.rice-=Math.ceil(amt*0.1);s.pop-=amt;ap--;continue;}}

const GMETA={"曹操":[97,"山"],"夏侯惇":[68,"山"],"夏侯淵":[51,"山"],"曹仁":[64,"水"],"荀彧":[74,"平"],"于禁":[59,"水"],"樂進":[60,"平"],"典韋":[39,"山"],"徐晃":[47,"山"],"張遼":[90,"水"],"張郃":[56,"山"],"袁紹":[50,"水"],"顏良":[52,"山"],"文醜":[50,"山"],"審配":[65,"水"],"沮授":[71,"平"],"公孫瓚":[50,"平"],"趙雲":[94,"山"],"嚴綱":[48,"平"],"劉備":[99,"平"],"關羽":[88,"水"],"張飛":[35,"山"],"呂布":[10,"山"],"陳宮":[70,"平"],"高順":[60,"山"],"袁術":[40,"平"],"紀靈":[36,"水"],"張勳":[45,"平"],"孫策":[90,"水"],"周瑜":[96,"水"],"程普":[79,"平"],"黃蓋":[80,"水"],"太史慈":[76,"山"],"周泰":[60,"水"],"劉表":[80,"水"],"蔡瑁":[50,"水"],"黃祖":[45,"水"],"文聘":[65,"山"],"劉璋":[77,"平"],"嚴顏":[86,"山"],"張任":[90,"山"],"黃權":[68,"平"],"馬騰":[84,"山"],"馬超":[76,"山"],"韓遂":[78,"平"],"龐德":[78,"山"],"董卓":[11,"山"],"李傕":[24,"山"],"郭汜":[12,"水"],"賈詡":[65,"平"],"張魯":[85,"山"],"楊任":[55,"山"],"楊昂":[50,"山"],"孔融":[80,"平"],"武安國":[36,"山"],"諸葛亮":[95,"水"],"龐統":[73,"平"],"黃忠":[75,"山"],"魏延":[26,"山"],"甘寧":[79,"水"],"徐庶":[80,"山"],"陸遜":[83,"水"],"呂蒙":[91,"水"],"魯肅":[93,"平"],"張昭":[88,"平"],"法正":[82,"平"],"馬良":[88,"平"],"華雄":[43,"山"],"田豐":[89,"平"],"廖化":[41,"水"],"孫權":[95,"水"],"張角":[80,"平"],"張梁":[45,"平"],"張寶":[50,"平"],"皇甫嵩":[82,"山"],"朱儁":[78,"山"],"盧植":[84,"平"],"孫堅":[85,"水"],"韓當":[88,"水"],"祖茂":[60,"水"]};
function levelNeed(lv){return lv<8?LVEXP[lv+1]:(300+(lv-7)*120);}
function gsOf(n){if(!GS[n]){const ge=GEN[n]||[60,50,60],lv=genLv(n);GS[n]={lv:lv,exp:LVEXP[lv]||0,wu:ge[0],zhi:ge[1],tong:ge[2],weap:(GD[n]?GD[n][7]:"無"),armor:(GD[n]?GD[n][8]:"無")};}return GS[n];}
function addExp(n,amt,owner){if(!(amt>0))return;const s=gsOf(n);s.exp+=amt;let up=0;while(s.lv<99&&s.exp>=levelNeed(s.lv)){s.lv++;up++;const gn=1+rnd(3);s.wu+=gn;s.tong+=1;}if(up&&owner===state.player)log("good","↑ "+n+" 升至 Lv"+s.lv+"（武力"+s.wu+"）");}
function genStats(g){const d=GD[g],s=gsOf(g);if(!d){return {wu:s.wu,zhi:s.zhi,tong:s.tong,de:60,zhong:100,hp:80,lv:s.lv,exp:s.exp,arm:"平軍",weap:s.weap,armor:s.armor};}return {wu:s.wu,zhi:s.zhi,tong:s.tong,de:d[5],zhong:d[4],hp:d[0],lv:s.lv,exp:s.exp,arm:d[6]+"軍",weap:s.weap,armor:s.armor};}
let genPage=0;
function openCityGens(){if(selected==null)return;genPage=0;renderCityGens();$('gencards').style.display='flex';}
function renderCityGens(){const s=state.cs[selected];const list=s.gens.slice();const per=10,pages=Math.max(1,Math.ceil(list.length/per));if(genPage>=pages)genPage=pages-1;if(genPage<0)genPage=0;const sl=list.slice(genPage*per,genPage*per+per);let html='';sl.forEach(g=>{const st=genStats(g);html+='<div class="gcard"><div class="gportrait">'+g.charAt(0)+'</div><div class="ginfo"><div class="gname">'+g+'　<small>Lv'+st.lv+'　exp'+st.exp+'</small></div><div class="gstats">體 '+st.hp+'　德 '+st.de+'　智 '+st.zhi+'　忠 '+st.zhong+'　武 '+st.wu+'</div><div class="gstats2">'+st.arm+' '+s.troops+'　⚔ '+st.weap+'　🛡 '+st.armor+'</div></div></div>';});$('gc-body').innerHTML=html||'<div style="text-align:center;padding:24px;color:#7a4a35">此城無武將</div>';$('gc-title').textContent=cityById(selected).name+' 武將（'+list.length+' 名）';$('gc-page').textContent=(genPage+1)+' / '+pages;}
function gcPage(d){const n=state.cs[selected].gens.length;const pages=Math.max(1,Math.ceil(n/10));genPage=Math.max(0,Math.min(pages-1,genPage+d));renderCityGens();}
const WEAPONS=[["短劍",3,50],["飛劍",4,70],["長劍",7,120],["破斬劍",9,180],["大劍",13,250],["薤刀",4,60],["眉尖刀",5,100],["三尖刀",8,150],["鉤鐮刀",10,200],["偃月刀",12,240],["鳳嘴刀",11,260],["矛",5,60],["雙戟",6,100],["單鉤鎗",7,120],["戰斧",10,200],["雙鉤鎗",11,250],["方天畫戟",16,300]];
const ARMORS=[["綸巾",2,50],["籠手",3,80],["兜",5,100],["硬皮",7,150],["鶴氅",8,200],["甲冑",10,250]];
const WATK={};WEAPONS.forEach(w=>WATK[w[0]]=w[1]);const ADEF={};ARMORS.forEach(a=>ADEF[a[0]]=a[1]);
function openShop(){if(!ownSel())return;const sel=$('shop-gen');const c=state.cs[selected];sel.innerHTML=c.gens.map(g=>'<option value="'+g+'">'+g+'</option>').join('');sel.onchange=renderShop;renderShop();$('shop').style.display='flex';}
function renderShop(){const c=state.cs[selected];$('shop-head').textContent=cityById(selected).name+'　金 '+c.gold;const g=$('shop-gen').value;if(!g){$('shop-cur').textContent='此城無武將';$('shop-weap').innerHTML='';$('shop-armor').innerHTML='';return;}const s=gsOf(g),mx=armMax(selected);$('shop-cur').innerHTML='目前：武器 <b>'+s.weap+'</b>(+'+(WATK[s.weap]||0)+')　防具 <b>'+s.armor+'</b>(+'+(ADEF[s.armor]||0)+')';$('shop-weap').innerHTML=WEAPONS.map((w,i)=>w[2]>mx?'':'<button class="shopbtn" onclick="buyEquip(0,'+i+')"'+(s.weap===w[0]?' disabled':'')+'>'+w[0]+' +'+w[1]+'　'+w[2]+'金</button>').join('');$('shop-armor').innerHTML=ARMORS.map((a,i)=>a[2]>mx?'':'<button class="shopbtn" onclick="buyEquip(1,'+i+')"'+(s.armor===a[0]?' disabled':'')+'>'+a[0]+' +'+a[1]+'　'+a[2]+'金</button>').join('');}
function buyEquip(type,idx){const c=state.cs[selected];const g=$('shop-gen').value;if(!g)return;const item=type?ARMORS[idx]:WEAPONS[idx];if(c.gold<item[2]){alert('金不足（需 '+item[2]+'）');return;}c.gold-=item[2];const s=gsOf(g);if(type)s.armor=item[0];else s.weap=item[0];log('good','['+cityById(selected).name+'] '+g+' 裝備 '+item[0]+'（-'+item[2]+'金）');renderShop();refreshLeft();}
function openGen(){$('setmenu').style.display='none';const tb=document.querySelector('#gt tbody');tb.innerHTML="";CITIES.forEach(c=>{const s=state.cs[c.id];if(s.owner!==state.player)return;s.gens.forEach(g=>{const tr=document.createElement('tr');tr.innerHTML="<td>"+g+"</td><td>"+c.name+"</td><td>"+GEN[g][0]+"</td><td>"+GEN[g][1]+"</td><td>"+GEN[g][2]+"</td>";tb.appendChild(tr);});(s.wild||[]).forEach(g=>{const tr=document.createElement('tr');tr.style.color="#8a5a3a";tr.innerHTML="<td>"+g+"·在野</td><td>"+c.name+"</td><td>"+GEN[g][0]+"</td><td>"+GEN[g][1]+"</td><td>"+GEN[g][2]+"</td>";tb.appendChild(tr);});});$('genlist').style.display='flex';}
function openLog(){$('setmenu').style.display='none';$('info-title').textContent="戰　報";$('info-body').innerHTML=history.map(h=>'<div class="'+h.cls+'">'+h.msg+'</div>').join("")||"（無）";$('info').style.display='flex';}
function openHelp(){$('setmenu').style.display='none';$('info-title').textContent="說　明";$('info-body').innerHTML='<div style="line-height:1.85;font-size:13px">點城池展開指令，按返回回地圖。每回合行動力（⚑）每指令耗1點，用盡按⏭進行。政廳：開墾/商業/治水/徵兵/訓練/登用。軍隊：出陣/移動。市集：買賣米。倉庫：輸送。登用：招攬城內在野武將（左欄「在野」顯示人數，需50金，成功率依太守智力；攻下他人城池後其在野武將仍可招攬）。</div>';$('info').style.display='flex';}
function openAllGen(){$('setmenu2').style.display='none';$('info-title').textContent='武將一覽';let h='';CITIES.forEach(c=>{const s=state.cs[c.id];const all=s.gens.concat((s.wild||[]).map(g=>g+'(在野)'));if(all.length)h+='<div style="margin-bottom:3px"><b>'+c.name+'</b>（'+facName(s.owner)+'）：'+all.join('、')+'</div>';});$('info-body').innerHTML='<div style="font-size:12px;line-height:1.7">'+(h||'（無）')+'</div>';$('info').style.display='flex';}
function openAllCity(){$('setmenu2').style.display='none';$('info-title').textContent='城池一覽';let h='<table class="gt"><thead><tr><th>城</th><th>勢力</th><th>兵</th><th>金</th><th>米</th></tr></thead><tbody>';CITIES.forEach(c=>{const s=state.cs[c.id];h+='<tr><td>'+c.name+'</td><td>'+facName(s.owner)+'</td><td>'+s.troops+'</td><td>'+s.gold+'</td><td>'+s.rice+'</td></tr>';});$('info-body').innerHTML=h+'</tbody></table>';$('info').style.display='flex';}
function cheatTodo(n){$('setmenu2').style.display='none';$('info-title').textContent=n;$('info-body').innerHTML='<div style="font-size:14px;text-align:center;padding:24px 10px">（'+n+' 功能待實作）</div>';$('info').style.display='flex';}
function showEnd(win){const ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="modal" style="text-align:center"><h2>'+(win?'天 下 一 統':'勢 力 滅 亡')+'</h2><p style="font-size:14px">'+(win?'恭喜！'+facName(state.player)+' 掃平群雄，成就霸業！':'你的勢力已被消滅……')+'</p><p style="font-size:13px">時為 '+state.year+'年'+state.month+'月</p><div class="bbtns"><button onclick="location.reload()">回主畫面</button></div></div>';document.body.appendChild(ov);}
function buildStart(){const g=$('scn-grid');g.innerHTML="";SCENARIOS.forEach(s=>{const d=document.createElement('div');d.className='fpick';d.style.borderColor="#9c2b1e";const n=s.setup?Object.keys(s.setup).length:FACTIONS.filter(f=>f.cities.length).length;d.innerHTML='<b style="color:#9c2b1e">'+s.name+'</b><br><span style="font-size:11px">'+s.sub+'</span><br>勢力 '+n+' 家';d.onclick=()=>pickScenario(s);g.appendChild(d);});}
function pickScenario(s){curScenario=s;$('scn-title').textContent=s.name;$('scn-stage').style.display='none';$('fac-stage').style.display='block';const grid=$('fac-grid');grid.innerHTML="";const facs=s.setup?FACTIONS.filter(f=>s.setup[f.id]):FACTIONS.filter(f=>f.cities.length);facs.forEach(f=>{const cities=s.setup?s.setup[f.id].cities:f.cities,gens=s.setup?s.setup[f.id].gens:f.gens;const d=document.createElement('div');d.className='fpick';d.style.borderColor=f.color;d.innerHTML='<b style="color:'+f.color+'">'+facName(f.id)+'</b> 〔'+f.flag+'〕<br>據點：'+cityById(cities[0]).name+' 等 '+cities.length+' 城<br>武將 '+gens.length+' 名';d.onclick=()=>initGame(f.id);grid.appendChild(d);});}
function backToScn(){$('fac-stage').style.display='none';$('scn-stage').style.display='block';}
function gotoMenu(){$('start').style.display='none';$('info').style.display='none';$('mainmenu').style.display='flex';}
function startNewGame(){$('mainmenu').style.display='none';$('scn-stage').style.display='block';$('fac-stage').style.display='none';$('start').style.display='flex';}
function backToMenu(){$('setmenu2').style.display='none';if(confirm('回主畫面？未存檔的進度會遺失。'))location.reload();}
function encodeSave(){return btoa(unescape(encodeURIComponent(JSON.stringify({sid:curScenario.id,state,history,gs:GS}))));}
function autoSave(){try{localStorage.setItem('sg_save_v1',encodeSave());}catch(e){}}
function slotKey(i){return i===0?'sg_save_v1':'sg_slot_'+i;}
function slotInfo(i){try{const raw=localStorage.getItem(slotKey(i));if(!raw)return null;let d;try{d=JSON.parse(decodeURIComponent(escape(atob(raw))));}catch(e){d=JSON.parse(raw);}return(d&&d.state)?d:null;}catch(e){return null;}}
function scenName(sid){const s=SCENARIOS.find(x=>x.id===sid);return s?s.name:'';}
function lordName(d){const s=SCENARIOS.find(x=>x.id===d.sid);const p=d.state.player;return(s&&s.names&&s.names[p])||(facOf(p)?facOf(p).name:p);}
function doLoadData(d){curScenario=SCENARIOS.find(s=>s.id===d.sid)||SCENARIOS[0];state=d.state;history=d.history||[];GS=d.gs||{};gameOver=false;zoom=1;zx=0;zy=0;zsel=false;zdrag=false;{var hz2=$("hud-zoom");if(hz2){hz2.textContent="🔍";hz2.title="放大";}}selected=null;activeMenu=null;pendingAction=null;$('savebox').style.display='none';$('mainmenu').style.display='none';$('start').style.display='none';$('setmenu').style.display='none';$('setmenu2').style.display='none';exitCity();refreshAll();log('sys','讀檔完成，'+state.year+'年'+state.month+'月。');playBgm();}
function doLoad(i){const d=slotInfo(i);if(d)doLoadData(d);else alert('沒有存檔。');}
function openSaveUI(mode){$('setmenu2').style.display='none';$('sb-title').textContent=mode==='save'?'存　檔':'讀　檔';let rows='';for(let i=0;i<=10;i++){const info=slotInfo(i);const name=i===0?'自動存檔':('存檔 '+i);const desc=info?(info.state.year+'年'+info.state.month+'月 ・ '+lordName(info)+' ・ '+scenName(info.sid)):'（空）';const dis=(mode==='save'&&i===0)||(mode==='load'&&!info);rows+='<div class="slotrow'+(dis?' dis':'')+'" data-i="'+i+'"><b>'+name+'</b><span>'+desc+'</span></div>';}$('sb-body').innerHTML='<div style="font-size:12px;color:#7a4a35;margin-bottom:8px">'+(mode==='save'?'點欄位存檔（自動存檔由系統管理，不可手動覆蓋）':'點有進度的欄位讀取')+'</div><div style="display:flex;flex-direction:column;gap:5px;max-height:50vh;overflow-y:auto">'+rows+'</div>';$('sb-body').querySelectorAll('.slotrow').forEach(el=>{if(el.classList.contains('dis'))return;el.onclick=()=>slotClick(mode,parseInt(el.dataset.i));});$('sb-btns').innerHTML='<button id="sb-x1">'+(mode==='save'?'複製備份碼':'貼備份碼讀取')+'</button><button id="sb-x2">關閉</button>';$('sb-x1').onclick=mode==='save'?exportCode:importCode;$('sb-x2').onclick=()=>{$('savebox').style.display='none';};$('savebox').style.display='flex';}
function slotClick(mode,i){if(mode==='save'){if(!state){alert('尚未開始遊戲。');return;}if(i===0)return;const code=encodeSave();let ok=true;try{localStorage.setItem(slotKey(i),code);}catch(e){ok=false;}if(!ok){alert('此瀏覽器儲存被封鎖，請改用「複製備份碼」。');return;}alert('✔ 已存到 存檔 '+i+'（'+state.year+'年'+state.month+'月）');openSaveUI('save');}else{const info=slotInfo(i);if(info)doLoadData(info);}}
function exportCode(){if(!state){alert('尚未開始遊戲。');return;}const c=encodeSave();let done=false;try{if(navigator.clipboard){navigator.clipboard.writeText(c);done=true;}}catch(e){}if(done)alert('✔ 已複製目前進度的備份碼！貼到記事本或傳給自己保存即可。');else prompt('複製此備份碼保存：',c);}
function importCode(){const c=prompt('貼上備份碼：');if(!c)return;try{let d;try{d=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));}catch(e){d=JSON.parse(c.trim());}if(!d||!d.state)throw 0;doLoadData(d);}catch(e){alert('備份碼無效。');}}
function saveGame(){openSaveUI('save');}
function loadGame(){openSaveUI('load');}
const EDF=[['金','gold',0,9999,100],['米','rice',0,9999,100],['財寶','bao',0,999,10],['土地','land',0,999,10],['產業','ind',0,999,10],['人口','pop',0,999900,1000],['防災','flood',0,100,5],['統治','gov',0,100,5]];
let edSnap=null;
function editorButtons(on){var b2=$('btn-back2'),bg=$('btn-gen'),bk=$('btn-back'),bm=$('btn-edmax');if(on){b2.innerHTML='兵力';b2.classList.remove('end');b2.onclick=edTroops;bm.style.display='';bg.innerHTML='確定';bg.classList.add('end');bg.onclick=edConfirm;bk.onclick=edCancel;}else{b2.innerHTML='編輯';b2.classList.add('end');b2.onclick=openEditor;bm.style.display='none';bg.innerHTML='<div class="av">⚔</div>武將';bg.classList.remove('end');bg.onclick=openCityGens;bk.onclick=exitCity;}}
function openEditor(){if(selected==null){alert('請先點選一座城池。');return;}edSnap=JSON.parse(JSON.stringify(state.cs[selected]));buildEditor();editorButtons(true);$('editor').style.display='block';}
function buildEditor(){const c=state.cs[selected];let html='';EDF.forEach((f,i)=>{const v=c[f[1]]||0;html+='<div class="edrow"><span class="edlbl">'+f[0]+'</span><span class="edval" id="edv'+i+'" onclick="edInput('+i+')">'+v+'</span><button class="edbtn" data-i="'+i+'" data-d="-1">−</button><input type="range" class="edsl" id="eds'+i+'" min="'+f[2]+'" max="'+f[3]+'" value="'+Math.min(f[3],v)+'"><button class="edbtn" data-i="'+i+'" data-d="1">＋</button></div>';});$('ed-left').innerHTML=html;EDF.forEach((f,i)=>{$('eds'+i).oninput=function(){edSet(i,parseInt(this.value));};});$('ed-left').querySelectorAll('.edbtn').forEach(b=>{b.onclick=function(){const i=+b.dataset.i,d=+b.dataset.d;edSet(i,(state.cs[selected][EDF[i][1]]||0)+d*EDF[i][4]);};});}
function edSet(i,val){const f=EDF[i];val=Math.max(f[2],Math.min(f[3],Math.round(val||0)));state.cs[selected][f[1]]=val;$('edv'+i).textContent=val;$('eds'+i).value=Math.min(f[3],val);}
function edInput(i){const f=EDF[i];const v=prompt(f[0]+'（'+f[2]+'~'+f[3]+'）：',state.cs[selected][f[1]]||0);if(v!==null&&v!=='')edSet(i,parseInt(v));}
function edMax(){EDF.forEach((f,i)=>edSet(i,f[3]));}
function edTroops(){const c=state.cs[selected];const v=prompt('設定兵力：',c.troops);if(v!==null)c.troops=Math.max(0,parseInt(v)||0);}
function edConfirm(){$('editor').style.display='none';editorButtons(false);refreshLeft();drawMap();}
function edCancel(){if(edSnap)state.cs[selected]=edSnap;$('editor').style.display='none';editorButtons(false);refreshLeft();drawMap();}
function fitStage(){$('stage').style.transform='scale('+Math.min(window.innerWidth/932,window.innerHeight/430)+')';}
window.addEventListener('resize',fitStage);
window.addEventListener('orientationchange',()=>setTimeout(fitStage,250));
fitStage();
(async()=>{mapImg=await tryLoadAsset(encodeURI('GPT修改圖/三國大地圖.jpg'));if(!mapImg)mapImg=await tryLoadAsset('map.png');battleImg=await tryLoadAsset('battle.png');bgm=new Audio(encodeURI('音樂/大地圖.mp3'));bgm.loop=true;bgm.volume=0.55;bgm2=new Audio(encodeURI('音樂/戰鬥.mp3'));bgm2.loop=true;bgm2.volume=0.55;if(state)drawMap();buildStart();try{if(localStorage.getItem('sg_save_v1'))$('mm-continue').style.display='block';}catch(e){}})();
