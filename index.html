<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>三國霸業</title>
<style>
  :root{--sea:#6fb3d8;--pink:#f3d4ca;--pink2:#f8e3da;--brown:#7a4a35;--brown2:#5a3526;--ink:#3a2418;--navy:#1f3a8a;--navy2:#16296b;--gold:#e8b94a;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{height:100vh;overflow:hidden;background:var(--navy2);touch-action:manipulation;font-family:"MingLiU","Microsoft JhengHei","Courier New",monospace;color:var(--ink);}
  #stagewrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 10px 16px,transparent 7px,var(--navy) 8px 9px,transparent 10px) 0 0/20px 16px,var(--navy2);}
  #stage{width:932px;height:430px;flex:0 0 auto;transform-origin:center center;position:relative;background:var(--sea);overflow:hidden;}
  .app{display:flex;gap:5px;width:100%;height:100%;padding:5px;}
  .center{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;background:var(--sea);position:relative;}
  canvas#map{max-width:100%;max-height:100%;cursor:pointer;display:block;}
  .left,.right{display:none;}
  #stage.city .left{display:flex;} #stage.city .right{display:flex;}
  .left{position:absolute;top:5px;left:5px;bottom:5px;z-index:7;width:250px;flex-direction:column;gap:4px;}
  .box{background:var(--pink);border:2px solid var(--brown);border-radius:3px;padding:3px 6px;box-shadow:inset 0 0 0 2px var(--pink2);}
  .lord{font-size:12px;line-height:1.45;color:var(--brown2);} .lord b{color:#9c2b1e;}
  .statehead{font-size:18px;font-weight:bold;color:var(--brown2);display:flex;align-items:baseline;gap:6px;}
  .statehead small{font-size:11px;color:#8a5a3a;font-weight:normal;}
  .stats{font-size:12px;line-height:1.5;}
  .stats .r{display:flex;justify-content:space-between;} .stats .r span:last-child{font-weight:bold;color:var(--brown2);}
  .stats .gm{display:flex;gap:12px;}
  .cmdbar{min-height:34px;display:flex;flex-wrap:wrap;gap:3px;}
  .cmdbar button{flex:1 1 30%;font-family:inherit;font-size:12px;background:var(--pink2);border:2px solid var(--brown);border-radius:3px;padding:4px 1px;cursor:pointer;color:var(--ink);}
  .cmdbar button:disabled{opacity:.4;} .cmdbar button.atk{background:#e8c9a0;border-color:#8a3a1a;color:#7a2a10;font-weight:bold;}
  .cmdbar .hint{flex:1 1 100%;font-size:11px;color:#8a5a3a;text-align:center;align-self:center;}
  .builds{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin-top:auto;}
  .bld{background:var(--pink2);border:2px solid var(--brown);border-radius:3px;padding:3px 1px;cursor:pointer;text-align:center;font-size:11px;color:var(--brown2);}
  .bld.on{background:var(--gold);} .bld svg{display:block;margin:0 auto 1px;width:30px;height:22px;}
  .right{position:absolute;top:5px;right:5px;bottom:5px;z-index:7;width:74px;flex-direction:column;gap:5px;}
  .rbtn{background:var(--pink);border:2px solid var(--brown);border-radius:3px;cursor:pointer;font-family:inherit;font-size:14px;color:var(--brown2);padding:9px 3px;text-align:center;}
  .rbtn.face{padding:3px;} .rbtn.face .av{width:100%;aspect-ratio:1;background:var(--gold);border:2px solid var(--brown2);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:2px;}
  .rbtn.end{background:#6b2f1d;color:var(--gold);border-color:var(--gold);font-weight:bold;margin-top:auto;}
  #hud{position:absolute;inset:0;pointer-events:none;z-index:8;} #stage.city #hud{display:none;} #hud>*{pointer-events:auto;}
  .datebar{position:absolute;top:8px;left:8px;background:var(--pink);border:2px solid var(--brown);border-radius:3px;padding:3px 10px;font-size:16px;font-weight:bold;color:var(--brown2);display:flex;gap:7px;align-items:center;box-shadow:inset 0 0 0 2px var(--pink2);}
  .datebar .ico{width:20px;height:20px;background:var(--navy);color:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .round{position:absolute;width:50px;height:50px;border-radius:50%;border:3px solid #aeb9d0;cursor:pointer;background:radial-gradient(circle at 34% 28%,#fff,#c6d0e2 70%,#9aa6c0);color:#33406a;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;}
  #hud-skip{top:64px;left:14px;} #hud-set,#hud-set2{right:14px;font-size:13px;} #hud-set{bottom:14px;} #hud-set2{bottom:72px;}
  #hud-msg{position:absolute;bottom:10px;left:10px;max-width:62%;background:var(--pink);border:2px solid var(--brown);border-radius:3px;padding:6px 14px;font-size:15px;font-weight:bold;color:#9c2b1e;box-shadow:inset 0 0 0 2px var(--pink2);transition:opacity .2s;}
  #hud-msg.faded{opacity:.22;pointer-events:none;}
  #setmenu{position:absolute;bottom:130px;right:14px;display:none;flex-direction:column;gap:4px;width:96px;}
  #setmenu2{position:absolute;bottom:130px;right:14px;display:none;flex-direction:column;gap:4px;width:96px;z-index:9;}
  #setmenu button,#setmenu2 button{font-family:inherit;font-size:13px;background:var(--pink);border:2px solid var(--brown);border-radius:3px;padding:6px 3px;cursor:pointer;color:var(--brown2);box-shadow:inset 0 0 0 2px var(--pink2);}
  #rotate{display:none;position:fixed;inset:0;z-index:99;background:var(--navy2);color:var(--gold);flex-direction:column;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:30px;gap:14px;}
  @media (orientation:portrait) and (pointer:coarse){#rotate{display:flex;}}
  .overlay{position:fixed;inset:0;background:rgba(10,15,40,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;}
  .modal{background:var(--pink);border:4px solid var(--gold);border-radius:5px;padding:18px;max-width:720px;max-height:90vh;overflow-y:auto;box-shadow:inset 0 0 0 2px var(--brown);}
  .modal h2{color:#9c2b1e;text-align:center;letter-spacing:6px;margin:0 0 10px;}
  .fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:12px 0;}
  .fpick{border:2px solid var(--brown);border-radius:3px;padding:6px;cursor:pointer;font-size:12px;background:var(--pink2);color:var(--ink);} .fpick b{font-size:15px;}
  .hint2{font-size:12px;color:#7a4a35;}
  table.gt{width:100%;border-collapse:collapse;font-size:13px;} table.gt th,table.gt td{border:1px solid var(--brown);padding:3px 6px;text-align:center;} table.gt th{background:var(--pink2);}
  .loglist{font-size:13px;line-height:1.6;max-height:50vh;overflow-y:auto;} .loglist .war{color:#b03a1e;} .loglist .good{color:#2f7a2f;} .loglist .sys{color:#3a4a8a;}
  #battleCanvas{width:100%;max-width:700px;border:3px solid var(--brown);border-radius:4px;background:#000;}
  .bbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  .bbtns button{font-family:inherit;font-size:15px;padding:8px 22px;background:var(--gold);border:2px solid var(--brown2);border-radius:3px;cursor:pointer;color:var(--ink);}
  #mainmenu{flex-direction:column;gap:16px;background:radial-gradient(circle at 50% 35%,#1b2750,#0a0e1c 75%);}
  .mmtitle{font-family:'MingLiU';font-size:52px;font-weight:bold;letter-spacing:10px;color:var(--gold);text-shadow:3px 3px 0 #6b2f1d,0 0 14px rgba(232,185,74,.45);}
  .mmsub{color:#9aa6c0;font-size:13px;letter-spacing:3px;margin-top:-6px;}
  .mmbtn{font-family:inherit;font-size:20px;letter-spacing:5px;padding:11px;background:linear-gradient(#f3e3ca,#e8c9a0);border:3px solid var(--gold);border-radius:5px;color:#5a3526;cursor:pointer;font-weight:bold;box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .mmbtn:active{background:var(--gold);}
  #start{background:#101935;}
</style>
</head>

</div></div>

function cmdChohei(){if(!ownSel())return;const c=state.cs[selected];if(!needAp())return;const room=Math.floor(c.pop*0.2)-c.troops;const amt=Math.min(1000,room,Math.floor(c.gold/0.05),Math.floor(c.rice/0.1));if(amt<100){log("sys","金、米或人口不足，無法徵兵。");return;}c.troops+=amt;c.gold-=Math.ceil(amt*0.05);c.rice-=Math.ceil(amt*0.1);c.pop-=amt;spend();log("good","["+cityById(selected).name+"] 徵兵 "+amt+"，士兵→"+c.troops);after();}

function cmdTouyo(){if(!ownSel())return;const c=state.cs[selected];if(!needAp())return;if(!c.wild||!c.wild.length){log("sys","此城無在野武將。");return;}if(c.gold<50){log("sys","金不足（登用需 50）。");return;}const g=c.wild[0],myG=topGen(selected),charm=myG?GEN[myG][1]:30,chance=0.35+charm/250;c.gold-=50;spend();if(Math.random()<chance){c.wild.shift();c.gens.push(g);log("good","★ ["+cityById(selected).name+"] 登用 "+g+" 成功！武"+GEN[g][0]+"/智"+GEN[g][1]+"/統"+GEN[g][2]);}else{log("war","["+cityById(selected).name+"] 招攬 "+g+"，對方婉拒（耗50金）。");}after();}

function resolveBattle(fromId,toId,isAI,aiFac){
  const A=state.cs[fromId],D=state.cs[toId];const aG=topGen(fromId),dG=topGen(toId);
  const send=Math.floor(A.troops*0.85);if(send<300)return;A.troops-=send;
  const data={fromId,toId,attacker:A.owner,defender:D.owner,aG,dG,atk:send,def:D.troops,aMax:send,dMax:D.troops,round:0,win:false};
  const aW=aG?GEN[aG][0]:40,aL=aG?GEN[aG][2]:30,dW=dG?GEN[dG][0]:40,dL=dG?GEN[dG][2]:30,wall=D.flood;
  while(data.atk>0&&data.def>0&&data.round<8){data.round++;
    const ap=data.atk*(0.5+aL/130)*(0.85+Math.random()*0.4)+aW*6;
    const dp=data.def*(0.5+dL/130)*(0.85+Math.random()*0.4)*(1+wall/200)+dW*6;
    data.atk=Math.max(0,data.atk-Math.floor(dp*0.10));data.def=Math.max(0,data.def-Math.floor(ap*0.10));}
  if(data.def<=0&&data.atk>0){data.win=true;const old=D.owner;D.owner=A.owner;D.troops=data.atk;D.gens=[];D.gov=Math.max(40,D.gov-20);if(aG){A.gens=A.gens.filter(g=>g!==aG);D.gens.push(aG);}if(old)checkElim(old);}
  else{A.troops+=data.atk;D.troops=data.def;}
  if(isAI){log("war","✖ 【"+facName(aiFac)+"】"+(data.win?"攻陷 ":"進攻 ")+cityById(toId).name+(data.win?"":"（守住）"));checkVictory();}
  else{showBattleScreen(data);}
  return data;
}
function showBattleScreen(data){
  const ov=$('battle');ov.style.display='flex';
  $('b-title').textContent=cityById(data.toId).name+" 攻防戰";
  const g=$('battleCanvas').getContext('2d');
  const aCol=facColor(data.attacker),dCol=facColor(data.defender);
  function draw(rep){
    if(battleImg){g.drawImage(battleImg,0,0,700,320);}
    else{g.fillStyle="#a9c170";g.fillRect(0,0,700,210);g.fillStyle="#6a8a3a";g.fillRect(0,210,700,110);}
    function army(x,col,flag,gen,cur,max,facing){
      g.strokeStyle="#5a3526";g.lineWidth=4;g.beginPath();g.moveTo(x,250);g.lineTo(x,150);g.stroke();
      g.fillStyle=col;g.fillRect(facing>0?x:x-46,150,46,34);g.fillStyle="#fff";g.font="bold 24px 'MingLiU'";g.textAlign="center";g.fillText(flag,facing>0?x+23:x-23,176);
      g.fillStyle=col;for(let i=0;i<10;i++){g.fillRect(x+facing*(20+i*14)-4,228,8,16);}
      g.fillStyle="#000";g.font="14px 'MingLiU'";g.textAlign=facing>0?"left":"right";g.fillText((gen||"無將")+"  "+cur,facing>0?x-40:x+40,285);
      g.fillStyle="#3a1a1a";g.fillRect(facing>0?x-40:x-150,292,190,12);g.fillStyle=col;g.fillRect(facing>0?x-40:x-150,292,190*Math.max(0,cur/max),12);}
    army(150,aCol,facFlag(data.attacker),data.aG,Math.round(data.aMax-(data.aMax-data.atk)*rep),data.aMax,1);
    army(550,dCol,facFlag(data.defender),data.dG,Math.round(data.dMax-(data.dMax-data.def)*rep),data.dMax,-1);
    g.fillStyle="#000";g.font="bold 18px 'MingLiU'";g.textAlign="center";g.fillText("⚔",350,180);}
  let rep=0;const tick=()=>{rep+=0.06;if(rep>=1){rep=1;draw(1);finish();return;}draw(rep);requestAnimationFrame(tick);};
  function finish(){const bb=$('b-btns');bb.innerHTML="";
    const m=document.createElement('div');m.style.cssText="width:100%;font-size:16px;color:#9c2b1e;font-weight:bold";
    m.textContent=data.win?("★ 攻陷 "+cityById(data.toId).name+"！殘兵 "+data.atk):("守城成功…攻方撤退（殘兵 "+data.atk+"）");bb.appendChild(m);
    const b=document.createElement('button');b.textContent="確定";b.onclick=()=>{ov.style.display='none';pendingAction=null;log(data.win?"good":"war",(data.win?"★ 攻陷 ":"✖ 未能攻下 ")+cityById(data.toId).name);checkVictory();after();};bb.appendChild(b);}
  draw(0);requestAnimationFrame(tick);
}
function doMove(fromId,toId){const A=state.cs[fromId],B=state.cs[toId];const send=Math.floor(A.troops*0.85);A.troops-=send;B.troops+=send;const g=topGen(fromId);if(g){A.gens=A.gens.filter(x=>x!==g);B.gens.push(g);}spend();pendingAction=null;log("good","["+cityById(fromId).name+"] 移兵 "+send+(g?("、"+g):"")+" → "+cityById(toId).name);after();}
function doSend(fromId,toId){const A=state.cs[fromId],B=state.cs[toId];const gold=Math.floor(A.gold*0.5),rice=Math.floor(A.rice*0.5);A.gold-=gold;A.rice-=rice;B.gold+=gold;B.rice+=rice;spend();pendingAction=null;log("good","["+cityById(fromId).name+"] 輸送 金"+gold+" 米"+rice+" → "+cityById(toId).name);after();}
function checkElim(fid){const has=CITIES.some(c=>state.cs[c.id].owner===fid);if(!has&&state.alive[fid]){state.alive[fid]=false;log("war","✖ 【"+facName(fid)+"】勢力滅亡！");}}
function checkVictory(){const en=FACTIONS.filter(f=>f.id!==state.player&&state.alive[f.id]);if(en.length===0&&!gameOver){gameOver=true;setTimeout(()=>showEnd(true),300);}if(state.alive[state.player]===false&&!gameOver){gameOver=true;setTimeout(()=>showEnd(false),300);}}
function endTurn(){if(gameOver)return;$('setmenu').style.display='none';$('setmenu2').style.display='none';exitCity();
  FACTIONS.forEach(f=>{if(f.id!==state.player&&state.alive[f.id])aiTurn(f.id);});
  CITIES.forEach(c=>{const s=state.cs[c.id];if(!s.owner)return;
    s.gold+=Math.floor(s.ind*(s.gov/100)*0.3);s.rice+=Math.floor(s.land*(s.gov/100)*0.5)-Math.floor(s.troops/100);
    if(s.rice<0){const lost=Math.min(s.troops,(-s.rice)*5);s.troops-=lost;s.rice=0;if(s.owner===state.player)log("sys","⚠ "+c.name+" 缺糧，逃兵 "+lost);}
    s.pop+=Math.floor(s.pop*0.01*(s.flood/100));
    if(Math.random()<(100-s.flood)/400){const d=Math.floor(s.land*0.15);s.land-=d;s.pop-=Math.floor(s.pop*0.03);if(s.owner===state.player)log("war","☂ "+c.name+" 遭天災，土地-"+d);}
    s.gov=Math.min(100,s.gov+1);});
  state.month++;if(state.month>12){state.month=1;state.year++;}
  recalcAp();log("sys","═══ "+state.year+"年 "+state.month+"月 ═══");refreshAll();autoSave();}
function aiTurn(fid){let ap=Math.min(12,3+CITIES.filter(c=>state.cs[c.id].owner===fid).length);
  const cities=CITIES.filter(c=>state.cs[c.id].owner===fid).map(c=>c.id);
  for(const cid of cities){if(ap<=0)break;const s=state.cs[cid];
    const tg=ADJ[cid].filter(id=>state.cs[id].owner!==fid).sort((a,b)=>state.cs[a].troops-state.cs[b].troops)[0];
    if(tg!=null&&s.troops>3000&&s.troops>state.cs[tg].troops*1.25){resolveBattle(cid,tg,true,fid);ap--;continue;}
    if(s.gold>1500&&s.troops<Math.floor(s.pop*0.18)){const amt=Math.min(1000,Math.floor(s.gold/0.05),Math.floor(s.rice/0.1));if(amt>=100){s.troops+=amt;s.gold-=Math.ceil(amt*0.05);s.rice-=Math.ceil(amt*0.1);s.pop-=amt;ap--;continue;}}
    if(s.wild&&s.wild.length&&s.gold>=300){s.gold-=50;const mg=topGen(cid);if(Math.random()<0.35+(mg?GEN[mg][1]:30)/250)s.gens.push(s.wild.shift());ap--;continue;}
    if(s.land<160){s.gold-=20;s.land+=6;ap--;}else if(s.ind<160){s.gold-=20;s.ind+=6;ap--;}else{s.flood=Math.min(100,s.flood+5);ap--;}}}
const canvas=$('map'),ctx=canvas.getContext('2d');
function drawMap(){
  if(mapImg){ctx.drawImage(mapImg,0,0,BUFW,BUFH);}
  else{ctx.fillStyle="#6fb3d8";ctx.fillRect(0,0,BUFW,BUFH);ctx.strokeStyle="rgba(120,90,50,.5)";ctx.lineWidth=1.5;EDGES.forEach(([a,b])=>{const pa=POS[a],pb=POS[b];ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();});}
  let targets=[];if(pendingAction){const f=pendingAction.from;targets=ADJ[f].filter(id=>{if(pendingAction.type==='attack')return state.cs[id].owner!==state.player;return state.cs[id].owner===state.player&&id!==f;});}
  CITIES.forEach(c=>drawFlag(c,state.cs[c.id],selected===c.id||(guided&&guidedIdx<CITIES.length&&CITIES[guidedIdx].id===c.id),targets.includes(c.id)));
}
function drawFlag(c,s,sel,tgt){
  const p=POS[c.id],ax=p.x,yb=p.y,col=facColor(s.owner),flag=s.owner?facFlag(s.owner):"";const px=ax-2;
  if(tgt){ctx.fillStyle="rgba(240,200,60,.85)";ctx.beginPath();ctx.arc(ax,yb-8,22,0,7);ctx.fill();}
  if(sel){ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.strokeRect(px-3,yb-30,30,30);}
  if(editMode){ctx.fillStyle="rgba(220,40,40,.9)";ctx.beginPath();ctx.arc(ax,yb,4,0,7);ctx.fill();}
  if(!hideFlags&&s.owner){
    ctx.strokeStyle="#5a3526";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(px,yb+6);ctx.lineTo(px,yb-30);ctx.stroke();
    ctx.fillStyle="#000";ctx.fillRect(px-1,yb-30,26,22);ctx.fillStyle=col;ctx.fillRect(px,yb-29,24,20);
    ctx.fillStyle="#fff";ctx.font="bold 16px 'MingLiU'";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(flag,px+12,yb-19);ctx.textBaseline="alphabetic";
  }
  ctx.font="bold 11px 'MingLiU'";ctx.textAlign="center";ctx.textBaseline="alphabetic";
  ctx.lineWidth=3;ctx.lineJoin="round";ctx.strokeStyle="#000";ctx.strokeText(c.name,ax,yb+18);
  ctx.fillStyle="#fff";ctx.fillText(c.name,ax,yb+18);
}
canvas.addEventListener('click',e=>{
  if(gameOver||!state)return;const r=canvas.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(BUFW/r.width),my=(e.clientY-r.top)*(BUFH/r.height);
  if(guided){placeGuided(mx,my);return;}
  if(editMode)return;
  let hit=null,best=1600;CITIES.forEach(c=>{const p=POS[c.id];const d=(p.x-mx)**2+(p.y-8-my)**2;if(d<best){best=d;hit=c.id;}});
  if(hit==null){if(!pendingAction&&$('stage').classList.contains('city'))exitCity();return;}
  if(pendingAction){const f=pendingAction.from;const ok=ADJ[f].includes(hit)&&(pendingAction.type==='attack'?state.cs[hit].owner!==state.player:(state.cs[hit].owner===state.player&&hit!==f));
    if(ok){if(pendingAction.type==='attack')resolveBattle(f,hit,false);else if(pendingAction.type==='move')doMove(f,hit);else doSend(f,hit);return;}pendingAction=null;}
  enterCity(hit);
});
function toBuf(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*(BUFW/r.width),(e.clientY-r.top)*(BUFH/r.height)];}
canvas.addEventListener('pointerdown',e=>{if(!editMode)return;const b=toBuf(e),mx=b[0],my=b[1];let best=3600,id=null;CITIES.forEach(c=>{const p=POS[c.id];const d=(p.x-mx)**2+(p.y-8-my)**2;if(d<best){best=d;id=c.id;}});dragId=id;if(id!=null){try{canvas.setPointerCapture(e.pointerId);}catch(_){}}});
canvas.addEventListener('pointermove',e=>{if(!editMode||dragId==null)return;const b=toBuf(e),mx=b[0],my=b[1];POS[dragId]={x:Math.round(Math.max(0,Math.min(BUFW,mx))),y:Math.round(Math.max(0,Math.min(BUFH,my+8)))};drawMap();});
canvas.addEventListener('pointerup',()=>{if(dragId!=null){savePos();dragId=null;}});

function openLog(){$('setmenu').style.display='none';$('info-title').textContent="戰　報";$('info-body').innerHTML=history.map(h=>'<div class="'+h.cls+'">'+h.msg+'</div>').join("")||"（無）";$('info').style.display='flex';}
function openHelp(){$('setmenu').style.display='none';$('info-title').textContent="說　明";$('info-body').innerHTML='<div style="line-height:1.85;font-size:13px">點城池展開指令，按返回回地圖。每回合行動力（⚑）每指令耗1點，用盡按⏭進行。政廳：開墾/商業/治水/徵兵/訓練/登用。軍隊：出陣/移動。市集：買賣米。倉庫：輸送。登用：招攬城內在野武將（左欄「在野」顯示人數，需50金，成功率依太守智力；攻下他人城池後其在野武將仍可招攬）。設定→逐城定位 可重新對位；換戰鬥背景放 battle.png(700×320)。</div>';$('info').style.display='flex';}
function openAllGen(){$('setmenu2').style.display='none';$('info-title').textContent='武將一覽';let h='';CITIES.forEach(c=>{const s=state.cs[c.id];const all=s.gens.concat((s.wild||[]).map(g=>g+'(在野)'));if(all.length)h+='<div style="margin-bottom:3px"><b>'+c.name+'</b>（'+facName(s.owner)+'）：'+all.join('、')+'</div>';});$('info-body').innerHTML='<div style="font-size:12px;line-height:1.7">'+(h||'（無）')+'</div>';$('info').style.display='flex';}
function openAllCity(){$('setmenu2').style.display='none';$('info-title').textContent='城池一覽';let h='<table class="gt"><thead><tr><th>城</th><th>勢力</th><th>兵</th><th>金</th><th>米</th></tr></thead><tbody>';CITIES.forEach(c=>{const s=state.cs[c.id];h+='<tr><td>'+c.name+'</td><td>'+facName(s.owner)+'</td><td>'+s.troops+'</td><td>'+s.gold+'</td><td>'+s.rice+'</td></tr>';});$('info-body').innerHTML=h+'</tbody></table>';$('info').style.display='flex';}
function cheatTodo(n){$('setmenu2').style.display='none';$('info-title').textContent=n;$('info-body').innerHTML='<div style="font-size:14px;text-align:center;padding:24px 10px">（'+n+' 功能待實作）</div>';$('info').style.display='flex';}
function showEnd(win){const ov=document.createElement('div');ov.className='overlay';ov.innerHTML='<div class="modal" style="text-align:center"><h2>'+(win?'天 下 一 統':'勢 力 滅 亡')+'</h2><p style="font-size:14px">'+(win?'恭喜！'+facName(state.player)+' 掃平群雄，成就霸業！':'你的勢力已被消滅……')+'</p><p style="font-size:13px">時為 '+state.year+'年'+state.month+'月</p><div class="bbtns"><button onclick="location.reload()">回主畫面</button></div></div>';document.body.appendChild(ov);}
function buildStart(){const g=$('scn-grid');g.innerHTML="";SCENARIOS.forEach(s=>{const d=document.createElement('div');d.className='fpick';d.style.borderColor="#9c2b1e";const n=s.setup?Object.keys(s.setup).length:FACTIONS.filter(f=>f.cities.length).length;d.innerHTML='<b style="color:#9c2b1e">'+s.name+'</b><br><span style="font-size:11px">'+s.sub+'</span><br>勢力 '+n+' 家';d.onclick=()=>pickScenario(s);g.appendChild(d);});}
function pickScenario(s){curScenario=s;$('scn-title').textContent=s.name;$('scn-stage').style.display='none';$('fac-stage').style.display='block';const grid=$('fac-grid');grid.innerHTML="";const facs=s.setup?FACTIONS.filter(f=>s.setup[f.id]):FACTIONS.filter(f=>f.cities.length);facs.forEach(f=>{const cities=s.setup?s.setup[f.id].cities:f.cities,gens=s.setup?s.setup[f.id].gens:f.gens;const d=document.createElement('div');d.className='fpick';d.style.borderColor=f.color;d.innerHTML='<b style="color:'+f.color+'">'+facName(f.id)+'</b> 〔'+f.flag+'〕<br>據點：'+cityById(cities[0]).name+' 等 '+cities.length+' 城<br>武將 '+gens.length+' 名';d.onclick=()=>initGame(f.id);grid.appendChild(d);});}
function backToScn(){$('fac-stage').style.display='none';$('scn-stage').style.display='block';}
function gotoMenu(){$('start').style.display='none';$('info').style.display='none';$('mainmenu').style.display='flex';}
function startNewGame(){$('mainmenu').style.display='none';$('scn-stage').style.display='block';$('fac-stage').style.display='none';$('start').style.display='flex';}
function backToMenu(){$('setmenu2').style.display='none';if(confirm('回主畫面？未存檔的進度會遺失。'))location.reload();}
function encodeSave(){return btoa(unescape(encodeURIComponent(JSON.stringify({sid:curScenario.id,state,history}))));}
function autoSave(){try{localStorage.setItem('sg_save_v1',encodeSave());}catch(e){}}
function saveGame(){$('setmenu2').style.display='none';if(!state){alert('還沒開始遊戲喔～先從主畫面「開始遊戲」。');return;}const code=encodeSave();let lsOk=true;try{localStorage.setItem('sg_save_v1',code);}catch(e){lsOk=false;}window._sc=code;$('sb-title').textContent='存　檔';$('sb-body').innerHTML='<div style="font-size:16px;text-align:center;font-weight:bold;margin:4px 0 12px;color:'+(lsOk?'#2f7a2f':'#b03a1e')+'">'+(lsOk?'✔ 已存檔！（'+state.year+'年 '+state.month+'月）':'⚠ 這個瀏覽器無法自動存檔')+'</div><div style="font-size:13px;line-height:1.9;color:#5a3526">'+(lsOk?'下次打開遊戲，按 ★ →「讀檔」→「讀取上次存檔」就能接著玩。':'請改用下面的「備份碼」保存進度。')+'<br><br>📱 <b>要換手機／電腦，或怕存檔不見？</b><br>按「複製備份碼」，把那串文字貼到記事本或傳訊息給自己存著；之後在「讀檔」貼回去就能還原。</div><textarea id="sb-code" readonly style="display:none;width:100%;height:20vh;font-size:11px;margin-top:8px" onclick="this.select()">'+code+'</textarea>';$('sb-btns').innerHTML='<button onclick="copySave()">複製備份碼</button><button onclick="$(\'savebox\').style.display=\'none\'">關閉</button>';$('savebox').style.display='flex';}
function copySave(){const c=(window._sc)||'';let done=false;const t=$('sb-code');if(t){t.style.display='block';try{t.select();done=document.execCommand('copy');}catch(e){}}try{if(navigator.clipboard&&c){navigator.clipboard.writeText(c);done=true;}}catch(e){}alert(done?'✔ 已複製備份碼！貼到記事本或傳給自己保存即可。':'請長按／全選下方文字，手動複製保存。');}
function loadGame(){$('setmenu2').style.display='none';let hasLS=false;try{hasLS=!!localStorage.getItem('sg_save_v1');}catch(e){}$('sb-title').textContent='讀　檔';$('sb-body').innerHTML='<div style="font-size:13px;line-height:1.9;color:#5a3526;margin-bottom:10px">'+(hasLS?'按下面綠色的「讀取上次存檔」就能繼續上次的進度。':'這個瀏覽器找不到自動存檔。')+'<br><br>📋 有<b>備份碼</b>嗎？把它貼進下面欄位，再按「用備份碼讀取」。</div><textarea id="sb-code" placeholder="（進階）在此貼上備份碼…" style="width:100%;height:18vh;font-size:11px"></textarea>';let b='';if(hasLS)b+='<button onclick="doLoad(0)" style="background:#bfe3b0;border-color:#2f7a2f">讀取上次存檔</button>';b+='<button onclick="doLoad(1)">用備份碼讀取</button><button onclick="$(\'savebox\').style.display=\'none\'">關閉</button>';$('sb-btns').innerHTML=b;$('savebox').style.display='flex';}
function doLoad(fromCode){try{let code;if(fromCode){code=($('sb-code').value||'').trim();if(!code){alert('請先貼上存檔代碼。');return;}}else{code=localStorage.getItem('sg_save_v1');}let d;try{d=JSON.parse(decodeURIComponent(escape(atob(code))));}catch(e){d=JSON.parse(code);}if(!d||!d.state)throw new Error('格式不符');curScenario=SCENARIOS.find(s=>s.id===d.sid)||SCENARIOS[0];state=d.state;history=d.history||[];gameOver=false;selected=null;activeMenu=null;pendingAction=null;$('savebox').style.display='none';$('mainmenu').style.display='none';$('start').style.display='none';$('setmenu').style.display='none';$('setmenu2').style.display='none';exitCity();refreshAll();log('sys','讀檔完成，'+state.year+'年'+state.month+'月。');}catch(e){alert('讀檔失敗：存檔代碼無效。');}}
function fitStage(){$('stage').style.transform='scale('+Math.min(window.innerWidth/932,window.innerHeight/430)+')';}
window.addEventListener('resize',fitStage);
window.addEventListener('orientationchange',()=>setTimeout(fitStage,250));
fitStage();
(async()=>{mapImg=await tryLoadAsset(encodeURI('GPT修改圖/三國大地圖.jpg'));if(!mapImg)mapImg=await tryLoadAsset('map.png');battleImg=await tryLoadAsset('battle.png');if(state)drawMap();buildStart();try{if(localStorage.getItem('sg_save_v1'))$('mm-continue').style.display='block';}catch(e){}})();
</script>
</body>
</html>
